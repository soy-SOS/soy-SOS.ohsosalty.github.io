- question: >-
    In welcher Beziehung stehen Theorie und Methode zur Politikwissenschaft?
  answer: >-
    - Theorie:
        - Fundamentale Konzepte, Erklärungen und Perspektiven erklären **wie und  warum** Politik funktioniert.

    - Methoden
        - Sind das Werkzeug, mit dem Fragen **empirisch** untersucht werden.
  subject: "Politikwissenschaften"
  module: "Intro Methoden und Statistik"
  topic: "Grundlagen"

- question: >-
    Was bedeutet der Begriff "empirische Sozialforschung"?
  answer: >-
    **Das systematische, datenbasierte Untersuchen von gesellschaftlichen und politischen Fragen.**
  children:
    - question: >-
        Was sind die Subkategorien der empirischen Sozialforschung?
      answer: >-
        | **Quantitativ** | Zahlen, Statistik, grosse Fallzahlen |

        | **Qualitativ** | Interviews, Texte |

        | **Mixed Methods** | Kombination |

        | **Computational** | Grosse Datenmengen, Text- & Netzwerkdaten |
  subject: "Politikwissenschaften"
  module: "Intro Methoden und Statistik"
  topic: "Grundlagen"

- question: >-
    Benenne alle Schritte der Analysekette.
  answer: >-
    1. Theorie
      - Beeinflusst Frage und Methode, denn je nach theoretischem Ansatz, eignen sich bestimmte Frage-/ Konzepttypen besser bzw schlechter als andere.
    2. Frage

    3. Konzept

    4. Operationalisierung

    5. Daten

    6. Antwort

    7. neue Fragen

    8. (Zyklus wiederholt sich)
  subject: "Politikwissenschaften"
  module: "Intro Methoden und Statistik"
  topic: "Grundlagen"

- question: >-
    Wie können Fragen wissenschaftlich beantwortet werden? (4 Merkmale)
  answer: >-
    Eine wissenschaftliche Frage erfordert eine wissenschaftliche Antwort, die folgende Merkmale aufweist:

    1. systematische Beobachtungen
        1. Beobachtungen werden entsprechend anerkanntem Schema gemacht, gesammelt und festgehalten.

    2. transparente Methoden
        1. Die Beobachtungen müssen anhand eines erklärten, klar verständlichen Vorgehens bearbeitet werden.
        2. Es muss klar sein, wie Daten verarbeitet wurden.

    3. nachvollziehbare Analysen
        1. Die Bearbeitung der Forschungsfrage muss klar verständlich sein.
        2. Die Auswertung der Datengrundlage (oder verallgemeinert der Informationsgrundlage) muss kohärent ausformuliert sein.

    4. überprüfbare Schlussfolgerungen      
        1. Das Fazit muss so formuliert sein, dass es widerlegt werden könnte.
  subject: "Politikwissenschaften"
  module: "Intro Methoden und Statistik"
  topic: "Grundlagen"

- question: >-
    Warum reichen einzelne (anekdotische) Erfahrungen nicht aus? (3 Punkte)
  answer: >-
    1. Auffällige Fälle bleiben stärker in Erinnerung.

    2. Persönliche Erfahrungen sind nicht immer repräsentativ.

    3. Erwartungen und Werteinstellungen beeinflussen unsere Wahrnehmung.
  subject: "Politikwissenschaften"
  module: "Intro Methoden und Statistik"
  topic: "Grundlagen"

- question: >-
    Welche (3) Fragen zeichnen die empirische Lösung aus?
  answer: >-
    - Tritt ein Muster systematisch auf?

    - Gilt die Beobachtung auch für andere Fälle?

    - Gibt es alternative Erklärungen?
  subject: "Politikwissenschaften"
  module: "Intro Methoden und Statistik"
  topic: "Grundlagen"

- question: >-
    Was bedeutet es Fragen "empirisch" zu beantworten?
  answer: >-
    Eine Untersuchung ist empirisch, wenn sie mithilfe von **Beobachtungen** und **Daten** erfolgt.
  subject: "Politikwissenschaften"
  module: "Intro Methoden und Statistik"
  topic: "Grundlagen"

- question: >-
    Woher stammen Daten, die für empirische Forschung geeignet sind? (4 Beispiele)
  answer: >-
    - Umfragen

    - Experimente

    - Interviews

    - offizielle Statistiken
  subject: "Politikwissenschaften"
  module: "Intro Methoden und Statistik"
  topic: "Grundlagen"

- question: >-
    Welche (4) Themen sind Untersuchungsgegenstände der Politikwissenschaft?
  answer: >-
    - Macht

    - Konflikt

    - Regeln

    - kollektive Entscheidungen
  subject: "Politikwissenschaften"
  module: "Intro Methoden und Statistik"
  topic: "Forschungsfrage"

- question: >-
    Was sind die (4) Quellen politischer Forschungsfragen?
  answer: >-
    - Politische Welt

    - Persönlicher Ausgangspunkt

    - Wissenschaftlicher Diskurs

    - Empirisches Rätsel
  subject: "Politikwissenschaften"
  module: "Intro Methoden und Statistik"
  topic: "Forschungsfrage"

- question: >-
    (4) Merkmale einer guten Fragestellung.
  answer: >-
    Klicke auf das Merkmal um die jeweiligen Details zu sehen.
  children:
    - question: >-
        Wissenschaftliche Relevanz
      answer: >-
        *Was versteht die Wissenschaft nachher besser?*


        Die Antwort auf die Frage leistet einen **begründeten Beitrag** zum Forschungsstand.
        Für die wissenschaftliche Relevanz braucht es also einen direkten Bezug zum aktuellen Forschungsstand.

        ## Verschiedene Beiträge zur Wissenschaft

        1. Der Forschungsstand ist lückenhaft.

        2. Es gibt widersprüchliche Theorien oder empirische Befunde.

        3. Aktuelle Erklärungen gelten nur für bestimmte Gruppen.

        4. Neue Daten, Konzepte, Methoden verändern den bisherigen Konsens.

        5. Das Problem lässt sich mit der Kombination von verschiedenen Forschungsansätzen besser erklären.
    - question: >-
        Klare Formulierung
      answer: >-
        *Sind die Konzepte der Frage eindeutig oder lassen sie Interpretationsspielraum?*


        Zentrale **Begriffe und Fälle sind erkennbar und eindeutig**. Ist eine Forschungsfrage unklar definiert, so ist es schwer, einen eindeutigen Beitrag zur Wissenschaft zu definieren. Eine unklare Frage muss aber nicht verworfen werden, sondern kann überarbeitet und präzisiert werden.

        ## Beispiel für Überarbeitung der Frage

        **Warum wählen Menschen nicht?**


        Problem -> Verbesserungsvorschlag:

        - Welche Menschen? -> junge Menschen in der Schweiz

        - Was für Wahlen? -> kantonale Abstimmungen

        - Welche Form von Erklärung ist gesucht? -> soziodemographische Gründe


        Eine bessere Frage wäre also: **Welche soziodemographischen Merkmale beeinflussen die Beteiligung an kantonalen Abstimmungen junger Erwachsener?**
    - question: >-
        Beantwortbar
      answer: >-
        *Sind wir mit den nötigen Mitteln ausgestattet, um die Frage überhaupt zu beantworten?*


        Beobachtungen und/oder stimmige, logische Argumente bestimmen die Antwort.
    - question: >-
        Offen
      answer: >-
        *Enthält die Formulierung der Frage gleich die Antwort (oder einen Teil der Antwort)?*


        Um die Frage ehrlich und wissenschaftlich beantworten zu können, muss sie offen formuliert sein. Ist sie so gestellt, dass sie kontroverse Annahmen trifft oder die eigene Wertung klar ersichtlich ist, so spricht man von einer **lenkenden Frage**.
  subject: "Politikwissenschaften"
  module: "Intro Methoden und Statistik"
  topic: "Forschungsfrage"

- question: >-
    (5) Frage-/Antworttypen und ihr jeweiliges Ziel.
  answer: >-
    Fragestellungen können in verschiedene Gruppen unterteilt werden. Ihre jeweiligen Antworten müssen zum gleichen Typus gehören.

    - Deskriptiv
        - Beschreibt Verteilung von Muster.

    - Vergleichend
        - Vergleicht Fälle systematisch.

    - Erklärend
        - Erläutert Ursachen oder Mechanismen.

    - Evaluativ
        - Beurteilt Wirkung von Interventionen.

    - Normativ
        - Begründet Kriterien und wendet sie an.

  subject: "Politikwissenschaften"
  module: "Intro Methoden und Statistik"
  topic: "Forschungsfrage"

- question: >-
    Bestimme den Fragetypen.
  children:
    - question: >-
        Erhöht E-Voting die Wahlbeteiligung?
      answer: >-
        Evaluativ
    - question: >-
        Wer beteiligt sich an Klimademonstrationen?
      answer: >-
        Deskriptiv
    - question: >-
        Haben Schweizer:innen höheres Vertrauen in die Politik als Einwohner angrenzender Nachbarstaaten?
      answer: >-
        Vergleichend
    - question: >-
        Weshalb stimmen Schweizer:innen gegen Massnahmen, die den Klimaschutz stärken?
      answer: >-
        Erklärend
  subject: "Politikwissenschaften"
  module: "Intro Methoden und Statistik"
  topic: "Forschungsfrage"

- question: >-
    Was sind Theorie, Erwartung und Hypothese?
  answer: >-
    Klicke für mehr Informationen zum jeweiligen Begriff.
  children:
    - question: >-
        Theorie
      answer: >-
        Die Theorie ist die begründete Auswahl möglicher Mechanismen. Sie stellt einen Zusammenhang zwischen zwei Variablen her und macht die Erwartungen sichtbar.
    - question: >-
        Erwartung
      answer: >-
        Die Erwartung ist die Anwendung der Theorie auf das zu untersuchende Fallbeispiel. Sie ist also die Beobachtung, die erklärt wird mittels der Theorie. Aus ihr wird die Hypothese gestellt.
    - question: >-
        Was ist die Hypothese? Was sind ihre 3 Bestandteile?
      answer: >-
        Die Hypothese ist die Behauptung, die sich von der Erwartung ableiten lässt. Ihre Bestandteile sind:


        - Erklärender Faktor: Unabhängige Variable

        - Ergebnis: Abhängige Variable

        - Erwartete Richtung: Form der Korrelation (positiv oder negativ)
    - question: >-
        Beispiel für politisches Wirksamkeitsgefühl und Wahlbeteiligung (hover für Auflösung):
      answer: >-
        - Mechanismus: <span class="spoiler">*Wer mehr Wirkung erwartet, investiert eher Zeit und Energie.*</span>

        - Erwartung: <span class="spoiler">*Höheres Wirksamkeitsgefühl geht mit mehr Engagement einher.*</span>

        - Hypothese: <span class="spoiler">*Je stärker das politische Wirksamkeitsgefühl junger Menschen, desto wahrscheinlicher beteiligen sie sich an Wahlen.*</span>
      open: open
  subject: "Politikwissenschaften"
  module: "Intro Methoden und Statistik"
  topic: "Forschungsfrage"
  open: open

- question: >-
    Was ist Operationalisierung?
  answer: >-
    Die für die Fragestellung relevanten Konzepte müssen für eine empirische Untersuchung **messbar gemacht werden**, wobei wir uns auf passende **Indikatoren** beruhen. Mittels Verwendung von Indikatoren, finden auch abstrakte Konzepte empirischen Ausdruck.
  subject: "Politikwissenschaften"
  module: "Intro Methoden und Statistik"
  topic: "Operationalisierung"

- question: >-
    5 Merkmale einer guten Hypothese
  answer: >-
    1. Sie benennt mindestens 2 Konzepte und ihre erwartete Beziehung.

    2. Sie erfolgt nachvollziehbar aus der theoretischen Erklärung.

    3. Sie ist allgemein genug, um mehr als nur einen einzelnen Fall zu betreffen.

    4. Sie ist präzise genug, um empirisch geprüft zu werden.

    5. Beobachtungen können ihr widersprechen.
  subject: "Politikwissenschaften"
  module: "Intro Methoden und Statistik"
  topic: "Forschungsfrage"

- question: >-
    Was ist die Nullhypothese?
  answer: >-
    Die Nullhypothese ist die Aussage, die besagt, dass die **Konzepte der Hypothese keine Beziehung** aufweisen.
    Sie ist das, was bei existierenden Daten als erstes überprüft wird.
  subject: "Politikwissenschaften"
  module: "Intro Methoden und Statistik"
  topic: "Forschungsfrage"

- question: >-
    Welche Auswirkung hat eine bestätigte Nullhypothese auf die Forschung?
  answer: >-
    Ist die Nullhypothese bestätigt, so lässt sich schliessen, dass **kein Zusammenhang zwischen den Konzepten der Hypothese** besteht.


    Somit gilt die **Hypothese** als **widerlegt**.


    Eine widerlegte Hypothese hat dennoch wissenschaftlichen Mehrwert.
  subject: "Politikwissenschaften"
  module: "Intro Methoden und Statistik"
  topic: "Forschungsfrage"

- question: >-
    4 Bestandteile der Forschungsantwort
  answer: >-
    Eine Antwort sollte klar trennen, was in der Forschungsarbeit gelernt wurde und was noch offen bleibt. Mögliche beantwortete oder offene Fragen sind Folgende.

    1. Besteht ein Zusammenhang zwischen den Konzepten?

    2. Passt das Muster zur theoretischen Erwartung?

    3. Ist der Zusammenhang kausal?

    4. Gilt der Zusammenhang (oder die Absenz eines Zusammenhangs) auch in anderen Kontexten?
  subject: "Politikwissenschaften"
  module: "Intro Methoden und Statistik"
  topic: "Forschungsfrage"

- question: >-
    Analysekette als Prüfkette: Was sind die (4) Fragen im Verlauf der Analysekette, mit denen ein Kettenbruch identifiziert werden kann?
  answer: >-
    1. <span class="spoiler">Passt Theorie zu Frage?</span>

    2. <span class="spoiler">Passen Konzepte und Messung zur Theorie?</span>

    3. <span class="spoiler">Passen Daten und Analyse zur gewünschten Antwort?</span>

    4. <span class="spoiler">Passt die Schlussfolgerung zur tatsächlich durchgeführten Analyse?</span>
  subject: "Politikwissenschaften"
  module: "Intro Methoden und Statistik"
  topic: "Forschungsfrage"

- question: >-
    Welche zwei grundlegenden Schritte machen die Operationalisierung aus?
  answer: >-
    - Klare Definition der Konzepte

    - Festlegen des Indikators und seiner Datenquelle
  subject: "Politikwissenschaften"
  module: "Intro Methoden und Statistik"
  topic: "Operationalisierung"

- question: >-
    (2 Punkte) Was ist ein Konzept? (2 Punkte) Was ist die Funktion des Konzeptes?
  answer: >-
    Konzepte sind oft Schlüsselbegriffe, die in der Fragestellung enthalten sind. Zwei Punkte, um zusammenzufassen, was ein Konzept ist, sind folgende:

    - abstrakte Idee

    - Container für empirische Phänomene

    Mit der Identifikation von Konzepten, kennen wir die Kernelemente unserer Forschungsfrage. Dies ermöglicht uns folgendes:

    - Ermöglicht Präzision und Abgrenzung

    - Diskrete Objekte und Situationen können zusammengefasst werden.
  subject: "Politikwissenschaften"
  module: "Intro Methoden und Statistik"
  topic: "Operationalisierung"

- question: >-
    Welche drei Ansätze zur Erstellung eines Konzept gibt es?
  answer: >-
    Die aufgelisteten Ansätze sind keineswegs die einzigen. Diese drei Beispiele wurden im Unterricht erwähnt, da sie in der Politikwissenschaft verbreitet sind.
  children:
    - question: >-
        Aristoteles
      answer: >-
        - wesentliche Merkmale isolieren

        - Parameter bestimmen (also Dinge, die das Konzept beeinflussen, identifizieren)

        - Dependenzen / Bedingungen erkennen (Hängt das Konzept von einer bestimmten Begebenheit ab?)
    - question: >-
        Wittgenstein
      answer: >-
        - Betrachten: wo gibt es Ähnlichkeiten?
            
        - Dieser Ansatz geht die Problemstellung mit einem Clustering-Ansatz an.
    - question: >-
        Bollen
      answer: >-
        Latente Variablen spiegeln sich in verschiedenen Messinstrumenten und Methoden wider.
  subject: "Politikwissenschaften"
  module: "Intro Methoden und Statistik"
  topic: "Operationalisierung"

- question: >-
    Welche 2 Arten von Messdaten gibt es? *Bezogen auf die Resultate, nicht inherent.*
  answer: >-
    - valide
        - face validity: offensichtlich
        - inhaltliche Validität: Resultate sind in sich stimmig / kohärent
        - Konstruktvalidität

    - reliabel
        - zuverlässig wiederholbar
  subject: "Politikwissenschaften"
  module: "Intro Methoden und Statistik"
  topic: "Daten"

- question: >-
    Welche Form von Variabeltypen und Skalentypen gibt es?
  answer: >-
    - kategorial, qualitativ
        - nominal
            - A, D
            
            - Ähnlichkeit + Differenz
            
            - Einteilung in Kategorien möglich.

        - ordinal
          - A, D, R

          - Ähnlichkeit + Differenz + Rang
          
          - Einteilung in Kategorien möglich, wobei die Einteilung hierarchisch ist.

    - numerisch, metrisch
        - intervall
            - A, D, R, I

            - Ähnlichkeit + Differenz + Rang + Intervall

            - Einteilung in hierarchische Abstufungen gleichen Abstands möglich, wobei es keinen absoluten Nullpunkt (bei der Skala) gibt.

        - ratio
            - A, D, R, I, V

            - Ähnlichkeit + Differenz + Rang + Intervall + Verhältnis

            - Einteilung in hierarchische Abstufungen gleichen Abstands möglich, wobei es einen absoluten Nullpunkt (bei der Skala) gibt.
  subject: "Politikwissenschaften"
  module: "Intro Methoden und Statistik"
  topic: "Daten"

- question: Bestimme den Skalentyp
  answer: ""
  children:
  - question: Alter
    answer: >-
      **Ratio**: 
  - question: >-
      Selbsteinschätzung Skala 0-10: politisch links (0), politisch rechts(10) 
    answer: >-
      **Ordinal**

      *Skalenwerte sind klar kategorisierbar und haben eine Rangfolge. Aber achtung: Es kann sich NICHT um ein Intervall oder ein Ratio handeln, da die Abstände zwischen den einzelnen Werten nicht konstant ist. Der Schritt von 3->4 ist nicht zwingend so gross wie der von 9->10*.

- question: >-
    Definiere "latente Konzepte"
  answer: >-
    Latente Konzepte sind nicht direkt beobachtbar. Das heisst, es gibt keinen fixen Messwert, der die Ausprägung des Konzeptes beschreiben könnte.
  subject: "Politikwissenschaften"
  module: "Intro Methoden und Statistik"
  topic: "Konzept"

- question: >-
    Wie kann man die Ausprägung eines latenten Konzeptes beobachten?
  answer: >-
    Indikatoren machen latente Konzepte beobachtbar.
  children:
  - question: >-
      4 Beispiele
    answer: >-
      - Selbsteinstufung

      - Einstellung Wirtschaft

      - Einstellung Migration

      - Parteiwahl
  subject: "Politikwissenschaften"
  module: "Intro Methoden und Statistik"
  topic: "Konzept"

- question: >-
    Wie ist zu sehen, ob Indikatoren latente Konzepte gut erschliessen?
  answer: >-
    Indem man **Reliabilität** und **Validität** überprüft.
  subject: "Politikwissenschaften"
  module: "Intro Methoden und Statistik"
  topic: "Konzept"

- question: >-
    Validität: Nenne die 3 Typen und ihre Definition.
  answer: >-
    Die Arten von Validität sind: Face-Validity, Inhaltsvalidität, Konstruktvalidität.
  children:
  - question: Face-Validität
    answer: Wirkt die Frage sinnvoll?
  - question: Inhaltsvalidität
    answer: Ist das Konzept durch die Frage komplett abgedeckt?
  - question: Konstruktvalidität
    answer: Passt der Indikator in die Theorie?
  subject: "Politikwissenschaften"
  module: "Intro Methoden und Statistik"
  topic: "Konzept"

- question: >-
    Was ist der Ablauf bei der Datenerhebung mittels Umfragen? Nenne die 3 Schritte in der richtigen Reihenfolge.
  answer: >-
    1. Person antwortet.

    2. Antwort wird notiert.

    3. Antwort wird in einem Datensatz abgespeichert.
  subject: "Politikwissenschaften"
  module: "Intro Methoden und Statistik"
  topic: "Daten"

- question: >-
    Welche Teile eines Datensatzes enthalten folgende Informationen?
  answer: >-
    Aufklappen für Lösungen.
  children:
  - question: Fälle
    answer: Zeile
  - question: Variablen
    answer: Spalte
  - question: Wert
    answer: Zelle
  subject: "Politikwissenschaften"
  module: "Intro Methoden und Statistik"
  topic: "Daten"
  open: open

- question: >-
    Was ist das arithmetische Mittel?
  answer: >-
    Das arithmetische Mittel, auch Durchschnitt genannt, ergibt sich aus der Summe aller Variabelwerte, geteilt durch die Anzahl Werte.

    Bestimme den Durchschnitt für die folgenden Listen.
  children:
  - question: werte = [1, 1, 1, 3, 3, 3]
    answer: >-
      average(`werte`) = **2**

      ...weil

      - summe(`werte`) = 12
      
      - 12 / N(`werte`) = 12 / 6 = 2
  - question: werte = [3, 24]
    answer: >-
      average(`werte`) = **13.5**

      ... weil

      - summe(`werte`) = 27
      
      - 27 / N(`werte`) = 27 / 2 = 13.5
  subject: "Politikwissenschaften"
  module: "Intro Methoden und Statistik"
  topic: "Daten"

- question: >-
    Was ist der Modus?
  answer: >-
    Der Modus ist der am häfigsten vorkommende Wert.
  children:
  - question: werte = [1, 1, 1, 5, 6, 10, 10]
    answer: modus(`werte`) = **1**
  subject: "Politikwissenschaften"
  module: "Intro Methoden und Statistik"
  topic: "Daten"

- question: >-
    Was ist der Median?
  answer: >-
    Für den Median werden alle Werte geordnet und unaggregiert aufgelistet. Der Median ist dann das mittlere Element, oder im Falle einer geraden Anzahl Werte, der Durchschnitt der beiden mittleren Werte.
  children:
  - question: werte = [1, 1, 1, 5, 1000, 1000, 2000]
    answer: >-
      median(`werte`) = **5**
      
      ...weil:

      median(`werte`) = `werte[(N(werte) - 1) / 2]` = `werte[3]` = 5
  - question: werte = [1, 2, 3, 4]
    answer: >-
      median(`werte`) = **2.5**

      ...weil
      - mittlere Elemente von `werte` sind `[2, 3]`

      - Durchschnitt der mittleren Werte = 2.5
  - question: werte = [3, 3, 6, 6, 2]
    answer: >-
      median(`werte`) = **3**

      ... weil

      - geordnete `werte` = `[2, 3, 3, 6, 6]`
      
      - mittleres Element = 3
  subject: "Politikwissenschaften"
  module: "Intro Methoden und Statistik"
  topic: "Daten"

- question: >-
    Welche zwei Varianten latente Konzepte zu operationalisieren gibt es?
  answer: >-
    - Ein einziger Indikator wird festgelegt und in einen messbaren Wert zusammengefasst. Als Beispiel: politisch rechts/links mit link = 0, rechts = 10 und Skala von 0 - 10.

    - Ein Index: Verschiedene Aspekte für das Konzept werden isoliert betrachtet, auseinandergenommen und einzeln vermessen. Später werden die verschiedenen Variablen zu einem Index kombiniert.
  subject: "Politikwissenschaften"
  module: "Intro Methoden und Statistik"
  topic: "Konzept"

